[tool.poetry]
name = "programmers-mathematics-linear-algebra"
version = "0.1.0"
description = "Elementary linear-algebra algorithms translated from the Ruby examples"
authors = ["edidada"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
